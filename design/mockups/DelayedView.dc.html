<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delayed view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C8F04A}a:hover{color:#DDF78A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EC; font-family: Barlow, system-ui, sans-serif">

  <div aria-label="Camera, shown with a delay" role="img" style="position: absolute; left: -42px; top: 0; width: 475px; height: 844px; overflow: hidden; background: linear-gradient(#262A30, #1B1E22 70%)">
    <div style="position: absolute; left: 0; right: 0; top: 712px; bottom: 0; background: #16181B; border-top: 2px solid #2A2E34"></div>
    <div style="position: absolute; left: 30px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <div style="position: absolute; left: 425px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <sc-for list="{{fig}}" as="b" hint-placeholder-count="14"><div style="position: absolute; {{b.s}}"></div></sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(rgba(14,15,17,0.85), rgba(14,15,17,0))"></div>

  <div style="position: absolute; left: 12px; top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
    <span style="height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(14,15,17,0.7); display: flex; align-items: center; gap: 8px; font: 700 16px 'Barlow Condensed', Barlow, sans-serif; letter-spacing: 0.5px">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #FF4D4D"></span>REC {{clock}}
    </span>
    <span style="padding: 6px 14px 8px; border-radius: 16px; background: #F2F1EC; color: #0E0F11; display: flex; flex-direction: column; line-height: 1">
      <span style="font: 700 40px 'Barlow Condensed', Barlow, sans-serif">{{delay}} s</span>
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">behind live</span>
    </span>
  </div>

  <div aria-label="Live camera" role="img" style="position: absolute; right: 12px; top: 16px; width: 96px; height: 171px; border-radius: 14px; overflow: hidden; border: 2px solid #F2F1EC; background: linear-gradient(#262A30, #1B1E22 70%)">
    <div style="position: absolute; left: 0; right: 0; top: 144px; bottom: 0; background: #16181B"></div>
    <sc-for list="{{live}}" as="b" hint-placeholder-count="14"><div style="position: absolute; {{b.s}}"></div></sc-for>
    <span style="position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(14,15,17,0.8); font-size: 12px; font-weight: 700; letter-spacing: 0.5px">LIVE</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 16px 20px; background: linear-gradient(rgba(14,15,17,0), rgba(14,15,17,0.92) 35%); display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="Delay" style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 15px; color: #B4B8BF; margin-right: 4px">Delay</span>
      <sc-for list="{{delays}}" as="d" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="height: 44px; flex: 1; border-radius: 12px; font: 700 16px Barlow, sans-serif; cursor: pointer; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}">{{d.label}}</button>
      </sc-for>
    </div>
    <a href="Mark.dc.html" style="height: 88px; border-radius: 24px; background: #C8F04A; color: #0E0F11; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.05">
        <span style="font: 700 28px 'Barlow Condensed', Barlow, sans-serif; letter-spacing: 0.5px">Keep this lift</span>
        <span style="font-size: 15px; font-weight: 600">then mark start and end</span>
      </span>
    </a>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" style="height: 44px; padding: 0 12px; border-radius: 22px; color: #F2F1EC; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: #FF4D4D"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
        End session
      </a>
      <span style="font-size: 14px; color: #8E939B; padding-right: 8px">Nothing to tap until you keep one</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._tick = setInterval(() => {
      const s = this.state || {};
      this.setState({ t: ((s.t == null ? 18 : s.t) + 0.1) % 30 });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this._tick); }

  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // The demo lifter at time t (s) of a 30 s buffer, in frame units (100 wide,
  // 178 tall): walks in 1-6 s, four lateral raises 8-20 s, walks out 23-28 s.
  pose(t) {
    const e = x => this.ease(x);
    let cx = 50, walking = false;
    if (t < 6) { cx = 135 - 85 * e((t - 1) / 5); walking = t > 1; }
    else if (t > 23) { cx = 50 - 85 * e((t - 23) / 5); walking = t < 28; }
    let th = 4;
    if (t >= 8 && t < 20) {
      const p = ((t - 8) % 3) / 3;
      th = 4 + 84 * (p < 0.4 ? e(p / 0.4) : p < 0.5 ? 1 : 1 - e((p - 0.5) / 0.5));
    }
    const sw = walking ? Math.sin(t * 7) * 5 : 0;
    const r = th * Math.PI / 180, f = th * 0.9 * Math.PI / 180;
    const arm = s => {
      const sh = { x: cx + s * 12, y: 58 };
      const el = { x: sh.x + s * 21 * Math.sin(r), y: sh.y + 21 * Math.cos(r) };
      const wr = { x: el.x + s * 19 * Math.sin(f), y: el.y + 19 * Math.cos(f) };
      return { sh, el, wr };
    };
    return {
      cx, sw, head: { x: cx, y: 44 }, L: arm(-1), R: arm(1),
      hipL: { x: cx - 8, y: 99 }, hipR: { x: cx + 8, y: 99 },
      kneeL: { x: cx - 9 + sw * 0.6, y: 128 }, kneeR: { x: cx + 9 - sw * 0.6, y: 128 },
      ankL: { x: cx - 9 + sw, y: 156 }, ankR: { x: cx + 9 - sw, y: 156 },
    };
  }

  // The lifter as rounded bars, W px wide frame: one style string per part.
  figure(t, W, body, bell) {
    const k = W / 100, p = this.pose(t), out = [];
    const f = n => n.toFixed(1);
    const seg = (a, b, w, c) => {
      const dx = (b.x - a.x) * k, dy = (b.y - a.y) * k, ww = w * k;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      out.push({ s: 'left:' + f(a.x * k - ww / 2) + 'px;top:' + f(a.y * k - ww / 2) + 'px;width:' + f(Math.hypot(dx, dy) + ww) + 'px;height:' + f(ww) + 'px;border-radius:' + f(ww / 2) + 'px;transform-origin:' + f(ww / 2) + 'px 50%;transform:rotate(' + f(ang) + 'deg);background:' + c });
    };
    seg({ x: p.cx, y: 56 }, { x: p.cx, y: 97 }, 22, body);
    seg(p.L.sh, p.R.sh, 9, body);
    seg(p.hipL, p.hipR, 12, body);
    for (const [h, kn, an] of [[p.hipL, p.kneeL, p.ankL], [p.hipR, p.kneeR, p.ankR]]) {
      seg(h, kn, 10, body); seg(kn, an, 8, body);
    }
    for (const a of [p.L, p.R]) {
      seg(a.sh, a.el, 7, body); seg(a.el, a.wr, 6, body);
      const dx = a.wr.x - a.el.x, dy = a.wr.y - a.el.y, n = Math.hypot(dx, dy) || 1;
      seg({ x: a.wr.x - dy / n * 5, y: a.wr.y + dx / n * 5 }, { x: a.wr.x + dy / n * 5, y: a.wr.y - dx / n * 5 }, 5, bell);
    }
    out.push({ s: 'left:' + f((p.head.x - 8) * k) + 'px;top:' + f((p.head.y - 9) * k) + 'px;width:' + f(16 * k) + 'px;height:' + f(18 * k) + 'px;border-radius:50%;background:' + body });
    return out;
  }

  renderVals() {
    const s = this.state || {};
    const t = s.t == null ? 18 : s.t;
    const delay = s.delay || 10;
    const secs = Math.floor(252 + t);
    return {
      fig: this.figure((t - delay + 30) % 30, 475, '#4D535C', '#8A9099'),
      live: this.figure(t, 96, '#5A616B', '#8A9099'),
      delay,
      clock: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'),
      delays: [5, 10, 15, 20].map(d => ({
        label: d + ' s',
        pressed: d === delay,
        bg: d === delay ? '#F2F1EC' : 'transparent',
        fg: d === delay ? '#0E0F11' : '#F2F1EC',
        border: d === delay ? '#F2F1EC' : '#3A3F46',
        pick: () => this.setState({ delay: d }),
      })),
    };
  }
}
</script>
</body>
</html>
