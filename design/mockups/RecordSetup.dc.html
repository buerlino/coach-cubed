<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up the camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C8F04A}a:hover{color:#DDF78A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EC; font-family: Barlow, system-ui, sans-serif">

  <div aria-label="Camera preview" role="img" style="position: absolute; left: -42px; top: 0; width: 475px; height: 844px; overflow: hidden; background: linear-gradient(#262A30, #1B1E22 70%)">
    <div style="position: absolute; left: 0; right: 0; top: 712px; bottom: 0; background: #16181B; border-top: 2px solid #2A2E34"></div>
    <div style="position: absolute; left: 30px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <div style="position: absolute; left: 425px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <sc-for list="{{fig}}" as="b" hint-placeholder-count="14"><div style="position: absolute; {{b.s}}"></div></sc-for>
  </div>

  <div style="position: absolute; left: 92px; top: 176px; width: 206px; height: 580px; border: 2px dashed rgba(242,241,236,0.55); border-radius: 24px; box-sizing: border-box"></div>
  <div style="position: absolute; left: 0; right: 0; top: 764px; text-align: center; font-size: 14px; font-weight: 600; color: #F2F1EC; text-shadow: 0 1px 3px #000">Whole body inside the frame</div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 12px 40px; background: linear-gradient(rgba(14,15,17,0.85), rgba(14,15,17,0)); display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(14,15,17,0.6); color: #F2F1EC; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <button type="button" onClick="{{nextLift}}" style="height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 22px; background: rgba(14,15,17,0.6); color: #F2F1EC; font: 600 16px Barlow, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <span>{{liftLabel}}</span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-label="Switch camera" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(14,15,17,0.6); color: #F2F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4.5 10a7.5 7.5 0 0 1 13.4-3.6L20 8.5M19.5 14a7.5 7.5 0 0 1-13.4 3.6L4 15.5"></path><path d="M20 4.5v4h-4M4 19.5v-4h4"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 76px; padding: 10px 14px; border-radius: 14px; background: rgba(14,15,17,0.72); font-size: 15px; line-height: 1.35; display: flex; gap: 10px; align-items: flex-start">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none; margin-top: 1px; fill: none; stroke: #C8F04A; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path></svg>
    <span>{{tip}}</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px 22px; border-radius: 24px 24px 0 0; background: rgba(14,15,17,0.94); display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="How the replay shows up" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #21242A">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="height: 44px; border: 0; border-radius: 10px; font: 600 15px Barlow, sans-serif; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 1.35; color: #B4B8BF; min-height: 40px">{{modeHelp}}</p>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 14px; line-height: 1.35; color: #8E939B; width: 110px">1080p · 30 fps<br>keeps the last 60 s</span>
      <a href="{{startHref}}" aria-label="Start session" style="width: 80px; height: 80px; flex: none; border-radius: 40px; border: 4px solid #F2F1EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <span style="width: 60px; height: 60px; border-radius: 30px; background: #FF4D4D"></span>
      </a>
      <span style="font-size: 16px; font-weight: 700; width: 110px; text-align: right">Start<br>session</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // The demo lifter at time t (s) of a 30 s buffer, in frame units (100 wide,
  // 178 tall): walks in 1-6 s, four lateral raises 8-20 s, walks out 23-28 s.
  pose(t) {
    const e = x => this.ease(x);
    let cx = 50, walking = false;
    if (t < 6) { cx = 135 - 85 * e((t - 1) / 5); walking = t > 1; }
    else if (t > 23) { cx = 50 - 85 * e((t - 23) / 5); walking = t < 28; }
    let th = 4;
    if (t >= 8 && t < 20) {
      const p = ((t - 8) % 3) / 3;
      th = 4 + 84 * (p < 0.4 ? e(p / 0.4) : p < 0.5 ? 1 : 1 - e((p - 0.5) / 0.5));
    }
    const sw = walking ? Math.sin(t * 7) * 5 : 0;
    const r = th * Math.PI / 180, f = th * 0.9 * Math.PI / 180;
    const arm = s => {
      const sh = { x: cx + s * 12, y: 58 };
      const el = { x: sh.x + s * 21 * Math.sin(r), y: sh.y + 21 * Math.cos(r) };
      const wr = { x: el.x + s * 19 * Math.sin(f), y: el.y + 19 * Math.cos(f) };
      return { sh, el, wr };
    };
    return {
      cx, sw, head: { x: cx, y: 44 }, L: arm(-1), R: arm(1),
      hipL: { x: cx - 8, y: 99 }, hipR: { x: cx + 8, y: 99 },
      kneeL: { x: cx - 9 + sw * 0.6, y: 128 }, kneeR: { x: cx + 9 - sw * 0.6, y: 128 },
      ankL: { x: cx - 9 + sw, y: 156 }, ankR: { x: cx + 9 - sw, y: 156 },
    };
  }

  // The lifter as rounded bars, W px wide frame: one style string per part.
  figure(t, W, body, bell) {
    const k = W / 100, p = this.pose(t), out = [];
    const f = n => n.toFixed(1);
    const seg = (a, b, w, c) => {
      const dx = (b.x - a.x) * k, dy = (b.y - a.y) * k, ww = w * k;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      out.push({ s: 'left:' + f(a.x * k - ww / 2) + 'px;top:' + f(a.y * k - ww / 2) + 'px;width:' + f(Math.hypot(dx, dy) + ww) + 'px;height:' + f(ww) + 'px;border-radius:' + f(ww / 2) + 'px;transform-origin:' + f(ww / 2) + 'px 50%;transform:rotate(' + f(ang) + 'deg);background:' + c });
    };
    seg({ x: p.cx, y: 56 }, { x: p.cx, y: 97 }, 22, body);
    seg(p.L.sh, p.R.sh, 9, body);
    seg(p.hipL, p.hipR, 12, body);
    for (const [h, kn, an] of [[p.hipL, p.kneeL, p.ankL], [p.hipR, p.kneeR, p.ankR]]) {
      seg(h, kn, 10, body); seg(kn, an, 8, body);
    }
    for (const a of [p.L, p.R]) {
      seg(a.sh, a.el, 7, body); seg(a.el, a.wr, 6, body);
      const dx = a.wr.x - a.el.x, dy = a.wr.y - a.el.y, n = Math.hypot(dx, dy) || 1;
      seg({ x: a.wr.x - dy / n * 5, y: a.wr.y + dx / n * 5 }, { x: a.wr.x + dy / n * 5, y: a.wr.y - dx / n * 5 }, 5, bell);
    }
    out.push({ s: 'left:' + f((p.head.x - 8) * k) + 'px;top:' + f((p.head.y - 9) * k) + 'px;width:' + f(16 * k) + 'px;height:' + f(18 * k) + 'px;border-radius:50%;background:' + body });
    return out;
  }

  renderVals() {
    const s = this.state || {};
    const lift = s.lift || 'lateral-raise';
    const mode = s.mode || 'button';
    const LIFTS = {
      'lateral-raise': { label: 'Lateral raise', tip: 'Lateral raise: face the camera from 3–4 m, phone at hip height, arms fully in frame.' },
      'snatch': { label: 'Snatch', tip: 'Snatch: film from the side, phone at hip height, bar and both feet in frame for the whole pull.' },
    };
    const MODES = [
      { id: 'button', label: 'Replay button', help: 'After the lift, walk back and tap Replay: the last 20 s play straight away.' },
      { id: 'delay', label: 'Delayed view', help: 'The screen shows the camera 10 s late, so you watch your lift as you walk back, hands-free.' },
    ];
    const cur = MODES.find(m => m.id === mode);
    return {
      fig: this.figure(7, 475, '#4D535C', '#8A9099'),
      liftLabel: LIFTS[lift].label,
      tip: LIFTS[lift].tip,
      nextLift: () => this.setState({ lift: lift === 'lateral-raise' ? 'snatch' : 'lateral-raise' }),
      modes: MODES.map(m => ({
        label: m.label,
        pressed: m.id === mode,
        bg: m.id === mode ? '#F2F1EC' : 'transparent',
        fg: m.id === mode ? '#0E0F11' : '#B4B8BF',
        pick: () => this.setState({ mode: m.id }),
      })),
      modeHelp: cur.help,
      startHref: mode === 'delay' ? 'DelayedView.dc.html' : 'RecordLive.dc.html',
    };
  }
}
</script>
</body>
</html>
