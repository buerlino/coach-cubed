  // The 17 joints at time t (s), linearly between frames, in px of a W x H frame.
  joints(t, W, H) {
    const F = this.frames(), x = Math.max(0, Math.min(74, t * 25));
    const i = Math.floor(x), j = Math.min(74, i + 1), a = x - i;
    return Array.from({ length: 17 }, (_, k) => ({
      x: (F[i][2 * k] + (F[j][2 * k] - F[i][2 * k]) * a) * W / 1000,
      y: (F[i][2 * k + 1] + (F[j][2 * k + 1] - F[i][2 * k + 1]) * a) * H / 1000,
    }));
  }

  bar(a, b, w, c) {
    const f = n => n.toFixed(1), dx = b.x - a.x, dy = b.y - a.y;
    return { s: 'left:' + f(a.x - w / 2) + 'px;top:' + f(a.y - w / 2) + 'px;width:' + f(Math.hypot(dx, dy) + w) + 'px;height:' + f(w) + 'px;border-radius:' + f(w / 2) + 'px;transform-origin:' + f(w / 2) + 'px 50%;transform:rotate(' + f(Math.atan2(dy, dx) * 180 / Math.PI) + 'deg);background:' + c };
  }

  renderVals() {
    const s = this.cur(), W = 202, H = 360;
    const P = this.joints(s.t, W, H);
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    // The "video": the lifter drawn as soft bars from the same track, so the
    // skeleton has something to sit on. The real app shows the recording.
    const G = '#454A52';
    const body = [
      this.bar(mid(P[5], P[6]), mid(P[11], P[12]), 40, G),
      this.bar(P[5], P[7], 13, G), this.bar(P[7], P[9], 11, G),
      this.bar(P[6], P[8], 13, G), this.bar(P[8], P[10], 11, G),
      this.bar(P[11], P[13], 17, G), this.bar(P[13], P[15], 14, G),
      this.bar(P[12], P[14], 17, G), this.bar(P[14], P[16], 14, G),
      this.bar(mid(P[3], P[4]), mid(P[3], P[4]), 26, G),
    ];
    const EDGES = [[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
    const fmt = t => t.toFixed(2);
    const pctAt = e => {
      const r = e.currentTarget.getBoundingClientRect();
      return Math.max(0, Math.min(2.99, (e.clientX - r.left) / r.width * 3));
    };
    const CUES = [
      { id: 'elbow', kind: 'work', title: 'Elbow lead', verdict: 'wrist rises above elbow', value: '−11.4%',
        cue: 'Through the raise the elbow stays at or slightly above the wrist — the wrist shouldn\'t flick up and lead the lift.',
        rule: 'Good from +5% (elbow above wrist), work on below −5%. Provisional.', detail: true },
      { id: 'top', kind: 'good', title: 'Top of rep', verdict: 'right at shoulder height', value: '+10.8%',
        cue: 'At the top of each rep the arms lift to about shoulder height — not swung above it, not stopped short.',
        rule: 'Good within 15% of torso length of shoulder height, work on beyond 30%. Provisional.' },
      { id: 'lean', kind: 'good', title: 'Torso lean', verdict: 'stays upright', value: '1.2°',
        cue: 'The trunk stays upright throughout the set: the weight is raised by the arms, not by leaning or swinging the torso.',
        note: 'The two sides disagree by 10.0° on average. A steady offset means the camera is not square to the lifter.',
        rule: 'Good up to 3° of sway (SD), work on beyond 7°. Provisional.' },
      { id: 'tempo', kind: 'good', title: 'Tempo', verdict: 'controlled descent', value: '1.07×',
        cue: 'The weight is lowered under control — the descent isn\'t noticeably faster than the raise.',
        rule: 'Good up to 1.5× faster down than up, work on beyond 2.5×. Provisional.' },
      { id: 'sym', kind: 'cant', title: 'Rep-to-rep symmetry', verdict: 'needs two reps or more', value: '—',
        cue: 'Only one rep was found in this clip — there\'s nothing to compare rep-to-rep.' },
    ];
    const LOOK = {
      good: { color: '#6FB7FF', status: 'Good' },
      work: { color: '#FF8A4C', status: 'Work on' },
      cant: { color: '#8E939B', status: 'Can\'t score' },
    };
    return {
      body,
      bones: EDGES.map(([a, b]) => this.bar(P[a], P[b], 3, 'rgba(200,240,74,0.95)')),
      joints: P.map(p => ({ x: p.x.toFixed(1), y: p.y.toFixed(1) })),
      showSkel: s.skel,
      skelDot: s.skel ? '#C8F04A' : '#4A4F57',
      toggleSkel: () => this.setState({ skel: !s.skel }),
      inLift: s.t >= 1.16 && s.t <= 2.96,
      clock: fmt(s.t),
      tNow: s.t.toFixed(2),
      pct: (s.t / 3 * 100).toFixed(2),
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      togglePlay: () => { this._last = null; this.setState({ playing: !s.playing }); },
      stepBack: () => this.setState({ playing: false, t: Math.max(0, Math.round(s.t * 25 - 1) / 25) }),
      stepFwd: () => this.setState({ playing: false, t: Math.min(2.96, Math.round(s.t * 25 + 1) / 25) }),
      speedLabel: s.speed === 1 ? '1×' : s.speed === 0.5 ? '½×' : '¼×',
      toggleSpeed: () => this.setState({ speed: s.speed === 1 ? 0.5 : s.speed === 0.5 ? 0.25 : 1 }),
      scrubDown: e => { e.currentTarget.setPointerCapture(e.pointerId); this.setState({ drag: true, t: pctAt(e) }); },
      scrubMove: e => { if (this.cur().drag) this.setState({ t: pctAt(e) }); },
      scrubUp: () => this.setState({ drag: false }),
      cues: CUES.map(c => Object.assign({}, c, LOOK[c.kind], {
        isGood: c.kind === 'good', isWork: c.kind === 'work', isCant: c.kind === 'cant',
        open: s.open === c.id,
        hasNote: !!c.note, hasRule: !!c.rule, hasDetail: !!c.detail,
        toggle: () => this.setState({ open: s.open === c.id ? null : c.id }),
      })),
    };
