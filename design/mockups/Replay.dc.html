<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C8F04A}a:hover{color:#DDF78A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EC; font-family: Barlow, system-ui, sans-serif">

  <div aria-label="Replay of the last 20 seconds" role="img" style="position: absolute; left: -42px; top: 0; width: 475px; height: 844px; overflow: hidden; background: linear-gradient(#262A30, #1B1E22 70%)">
    <div style="position: absolute; left: 0; right: 0; top: 712px; bottom: 0; background: #16181B; border-top: 2px solid #2A2E34"></div>
    <div style="position: absolute; left: 30px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <div style="position: absolute; left: 425px; top: 120px; width: 18px; height: 600px; background: #202328"></div>
    <sc-for list="{{fig}}" as="b" hint-placeholder-count="14"><div style="position: absolute; {{b.s}}"></div></sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 12px 48px; background: linear-gradient(rgba(14,15,17,0.85), rgba(14,15,17,0)); display: flex; align-items: center; gap: 8px">
    <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F2F1EC; color: #0E0F11; display: flex; align-items: center; gap: 8px; font: 700 17px 'Barlow Condensed', Barlow, sans-serif; letter-spacing: 1px">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 12a8 8 0 1 0 2.6-5.9"></path><path d="M4 4v4.5h4.5"></path></svg>
      REPLAY
    </span>
    <span style="font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000">{{ago}}</span>
    <span style="margin-left: auto; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(14,15,17,0.7); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF4D4D"></span>Still recording
    </span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 16px 20px; background: linear-gradient(rgba(14,15,17,0), rgba(14,15,17,0.92) 35%); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: rgba(242,241,236,0.14); color: #F2F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </sc-if>
      </button>
      <div onPointerDown="{{scrubDown}}" onPointerMove="{{scrubMove}}" onPointerUp="{{scrubUp}}" role="slider" aria-label="Replay position" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{posNow}}" tabindex="0" style="flex: 1; height: 44px; position: relative; cursor: pointer; touch-action: none">
        <div style="position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: rgba(242,241,236,0.25)"></div>
        <div style="position: absolute; left: 0; top: 20px; height: 4px; border-radius: 2px; background: #F2F1EC; width: {{pct}}%"></div>
        <div style="position: absolute; top: 13px; width: 18px; height: 18px; margin-left: -9px; border-radius: 9px; background: #F2F1EC; left: {{pct}}%"></div>
      </div>
      <span style="width: 70px; flex: none; text-align: right; font: 600 15px Barlow, sans-serif; color: #B4B8BF">{{pos}} / 0:20</span>
      <button type="button" onClick="{{toggleSpeed}}" aria-label="Playback speed" style="width: 52px; height: 44px; flex: none; border: 1px solid #2E3238; border-radius: 12px; background: transparent; color: #F2F1EC; font: 700 15px Barlow, sans-serif; cursor: pointer">{{speedLabel}}</button>
    </div>
    <a href="Mark.dc.html" style="height: 64px; border-radius: 20px; background: #C8F04A; color: #0E0F11; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 20px Barlow, sans-serif; text-decoration: none">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      Keep and mark the lift
    </a>
    <a href="RecordLive.dc.html" style="height: 56px; border-radius: 20px; border: 1px solid #3A3F46; color: #F2F1EC; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px Barlow, sans-serif; text-decoration: none">
      Not this one: back to live <span style="color: #8E939B; font-weight: 500">in {{countdown}}</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._tick = setInterval(() => {
      const s = this.cur();
      if (!s.playing || s.drag) return;
      this.setState({ pos: (s.pos + 0.05 * s.speed) % 20, left: Math.max(0, s.left - 0.05) });
    }, 50);
  }
  componentWillUnmount() { clearInterval(this._tick); }

  cur() { return Object.assign({ pos: 2, playing: true, speed: 1, left: 25, drag: false }, this.state || {}); }

  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // The demo lifter at time t (s) of a 30 s buffer, in frame units (100 wide,
  // 178 tall): walks in 1-6 s, four lateral raises 8-20 s, walks out 23-28 s.
  pose(t) {
    const e = x => this.ease(x);
    let cx = 50, walking = false;
    if (t < 6) { cx = 135 - 85 * e((t - 1) / 5); walking = t > 1; }
    else if (t > 23) { cx = 50 - 85 * e((t - 23) / 5); walking = t < 28; }
    let th = 4;
    if (t >= 8 && t < 20) {
      const p = ((t - 8) % 3) / 3;
      th = 4 + 84 * (p < 0.4 ? e(p / 0.4) : p < 0.5 ? 1 : 1 - e((p - 0.5) / 0.5));
    }
    const sw = walking ? Math.sin(t * 7) * 5 : 0;
    const r = th * Math.PI / 180, f = th * 0.9 * Math.PI / 180;
    const arm = s => {
      const sh = { x: cx + s * 12, y: 58 };
      const el = { x: sh.x + s * 21 * Math.sin(r), y: sh.y + 21 * Math.cos(r) };
      const wr = { x: el.x + s * 19 * Math.sin(f), y: el.y + 19 * Math.cos(f) };
      return { sh, el, wr };
    };
    return {
      cx, sw, head: { x: cx, y: 44 }, L: arm(-1), R: arm(1),
      hipL: { x: cx - 8, y: 99 }, hipR: { x: cx + 8, y: 99 },
      kneeL: { x: cx - 9 + sw * 0.6, y: 128 }, kneeR: { x: cx + 9 - sw * 0.6, y: 128 },
      ankL: { x: cx - 9 + sw, y: 156 }, ankR: { x: cx + 9 - sw, y: 156 },
    };
  }

  // The lifter as rounded bars, W px wide frame: one style string per part.
  figure(t, W, body, bell) {
    const k = W / 100, p = this.pose(t), out = [];
    const f = n => n.toFixed(1);
    const seg = (a, b, w, c) => {
      const dx = (b.x - a.x) * k, dy = (b.y - a.y) * k, ww = w * k;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      out.push({ s: 'left:' + f(a.x * k - ww / 2) + 'px;top:' + f(a.y * k - ww / 2) + 'px;width:' + f(Math.hypot(dx, dy) + ww) + 'px;height:' + f(ww) + 'px;border-radius:' + f(ww / 2) + 'px;transform-origin:' + f(ww / 2) + 'px 50%;transform:rotate(' + f(ang) + 'deg);background:' + c });
    };
    seg({ x: p.cx, y: 56 }, { x: p.cx, y: 97 }, 22, body);
    seg(p.L.sh, p.R.sh, 9, body);
    seg(p.hipL, p.hipR, 12, body);
    for (const [h, kn, an] of [[p.hipL, p.kneeL, p.ankL], [p.hipR, p.kneeR, p.ankR]]) {
      seg(h, kn, 10, body); seg(kn, an, 8, body);
    }
    for (const a of [p.L, p.R]) {
      seg(a.sh, a.el, 7, body); seg(a.el, a.wr, 6, body);
      const dx = a.wr.x - a.el.x, dy = a.wr.y - a.el.y, n = Math.hypot(dx, dy) || 1;
      seg({ x: a.wr.x - dy / n * 5, y: a.wr.y + dx / n * 5 }, { x: a.wr.x + dy / n * 5, y: a.wr.y - dx / n * 5 }, 5, bell);
    }
    out.push({ s: 'left:' + f((p.head.x - 8) * k) + 'px;top:' + f((p.head.y - 9) * k) + 'px;width:' + f(16 * k) + 'px;height:' + f(18 * k) + 'px;border-radius:50%;background:' + body });
    return out;
  }

  renderVals() {
    const s = this.cur();
    const fmt = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
    const posAt = e => {
      const r = e.currentTarget.getBoundingClientRect();
      return Math.max(0, Math.min(19.99, (e.clientX - r.left) / r.width * 20));
    };
    return {
      // The replay covers buffer seconds 6-26: the walk-in's end, the set, the walk-out.
      fig: this.figure(6 + s.pos, 475, '#4D535C', '#8A9099'),
      ago: Math.round(20 - s.pos) + ' s ago',
      pos: fmt(s.pos),
      posNow: Math.round(s.pos),
      pct: (s.pos / 20 * 100).toFixed(2),
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !s.playing }),
      speedLabel: s.speed === 1 ? '1×' : '½×',
      toggleSpeed: () => this.setState({ speed: s.speed === 1 ? 0.5 : 1 }),
      countdown: fmt(s.left),
      scrubDown: e => { e.currentTarget.setPointerCapture(e.pointerId); this.setState({ drag: true, pos: posAt(e) }); },
      scrubMove: e => { if (this.cur().drag) this.setState({ pos: posAt(e) }); },
      scrubUp: () => this.setState({ drag: false }),
    };
  }
}
</script>
</body>
</html>
